name: flutter_eml_msg_viewer
description: >
  A Flutter widget and parser for previewing .eml (RFC822/MIME) and .msg
  (Outlook CFBF/MAPI) email files on Android and iOS with zero external dependencies.
version: 1.1.0
homepage: https://github.com/amidelu/Flutter-Eml-Msg-Viewer
repository: https://github.com/amidelu/Flutter-Eml-Msg-Viewer

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

platforms:
  android:
  ios:

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  plugin:
    platforms:
      android:
        package: com.amidelu.flutter_eml_msg_viewer
        pluginClass: FlutterEmlMsgViewerPlugin
      ios:
        pluginClass: FlutterEmlMsgViewerPlugin
